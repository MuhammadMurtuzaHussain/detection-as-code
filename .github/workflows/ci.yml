name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint the Python
        run: ruff check .

      - name: Test every rule against its benign and malicious logs
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Browser engine returns the same verdicts as the Python engine
        run: node --test tests/parity.test.js

      - name: Write a results table to the job summary
        if: always()
        run: python -m dac check --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: The dashboard builds
        run: python -m dac build --out site

  pages:
    # Publish the dashboard only from main, and only when every test above passed.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m dac build --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
